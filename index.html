<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howl.na_ | Social Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            display: block;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ảnh đại diện: Na có thể thay link ảnh cá nhân vào src -->
        <img class="profile-img" src="https://ui-avatars.com/api/?name=Howl+Na&background=38bdf8&color=fff&size=128" alt="Avatar">
        
        <h1>Howl.na_</h1>
        <p>IT Student | Xanh SM Driver</p>

        <div class="links">
            <!-- Na nhớ thay các đường link thực tế của mình vào phần href="..." bên dưới -->
            <a href="https://facebook.com/rusiannn" target="_blank" class="btn">Facebook</a>
            <a href="https://instagram.com/howl.na_" target="_blank" class="btn">Instagram</a>
            <a href="https://tiktok.com/@howl.na_" target="_blank" class="btn">TikTok</a>
        </div>
    </div>

</body>
</html>
